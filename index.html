<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>慢漫｜旅行記憶貼紙圖鑑</title>
  <style>
    :root {
      --bg-page: #F9F8F6;        /* 溫潤霧白底色 */
      --bg-card: #FFFFFF;        /* 純白圖鑑卡 */
      --slot-locked: #EDEDEB;    /* MapSprink 淺灰圓形槽底色 */
      --slot-unlocked: #FFF8E1;  /* 解鎖後的暖奶油亮底 (#FFE599 柔化版) */
      --accent-yellow: #FFE599;  /* 品牌主題柔光黃 */
      --morandi-green: #7A8B7B;  /* 莫蘭迪鼠尾草綠 */
      --text-main: #3D3B38;      /* 炭灰主字色 */
      --text-muted: #9A9690;     /* 淺灰未解鎖字色 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      padding: 32px 16px 60px;
      line-height: 1.6;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    /* 頂部品牌標題區 (清新極簡雜誌風) */
    .header-card {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 28px 32px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 28px;
      border: 1px solid rgba(0,0,0,0.03);
    }

    .brand-info span.badge {
      display: inline-block;
      background: var(--accent-yellow);
      color: #5C4B1B;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 99px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .brand-info h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .brand-info p {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* 收集進度膠囊 */
    .progress-box {
      background: var(--bg-page);
      padding: 14px 24px;
      border-radius: 18px;
      text-align: center;
      min-width: 150px;
    }
    .progress-box .count {
      font-size: 26px;
      font-weight: 800;
      color: var(--morandi-green);
    }
    .progress-box .label {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* 分類切換列 */
    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .filter-btn {
      background: var(--bg-card);
      border: 1px solid #E5E3DC;
      color: var(--text-main);
      padding: 7px 18px;
      border-radius: 99px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .filter-btn.active {
      background: var(--morandi-green);
      color: #FFF;
      border-color: var(--morandi-green);
    }

    /* MapSprink 風格圓形圖鑑網格 */
    .sticker-grid {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
      gap: 32px 20px;
      justify-items: center;
    }

    .sticker-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      text-decoration: none;
      group: sticker;
      width: 125px;
    }

    /* 圓形底座 (完全還原第二張截圖的圓圈) */
    .circle-slot {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      background-color: var(--slot-locked);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      margin-bottom: 10px;
    }

    /* 貼紙圖片本體 */
    .circle-slot img {
      width: 82%;
      height: 82%;
      object-fit: contain;
      /* 未收集狀態：自動轉黑白灰階 + 降低透明度 */
      filter: grayscale(100%) opacity(0.35) contrast(0.9);
      transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
    }

    /* 已解鎖狀態：底座變暖光黃、貼紙變全彩並稍微放大突破圓框 */
    .sticker-item.unlocked .circle-slot {
      background-color: var(--slot-unlocked);
      box-shadow: 0 6px 18px rgba(212, 180, 95, 0.18);
    }

    .sticker-item.unlocked .circle-slot img {
      width: 96%;
      height: 96%;
      filter: grayscale(0%) opacity(1) drop-shadow(0 5px 10px rgba(0,0,0,0.16));
      transform: scale(1.06);
    }

    /* 滑鼠移上去的微互動 */
    .sticker-item:hover .circle-slot {
      transform: translateY(-4px);
    }

    /* 剛解鎖時的 Q 彈貼上動畫 */
    @keyframes popSticker {
      0% { transform: scale(1.8) rotate(-8deg); opacity: 0; }
      60% { transform: scale(0.92) rotate(3deg); opacity: 1; }
      80% { transform: scale(1.08) rotate(-1deg); }
      100% { transform: scale(1.06) rotate(0deg); }
    }
    .sticker-item.just-unlocked .circle-slot img {
      animation: popSticker 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* 貼紙下方標題 */
    .sticker-title {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-muted);
      text-align: center;
      transition: color 0.2s;
    }
    .sticker-item.unlocked .sticker-title {
      color: var(--text-main);
      font-weight: 600;
    }

    .sticker-date {
      font-size: 11px;
      color: var(--morandi-green);
      margin-top: 2px;
      min-height: 16px;
    }

    /* 彈出詳情視窗 (點擊貼紙時顯示) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(40, 38, 35, 0.45);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-backdrop.show { display: flex; }

    .modal-box {
      background: #FFF;
      border-radius: 24px;
      max-width: 360px;
      width: 100%;
      padding: 32px 24px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      position: relative;
    }
    .modal-box img {
      width: 140px;
      height: 140px;
      object-fit: contain;
      margin-bottom: 14px;
    }
    .modal-box img.locked-img {
      filter: grayscale(100%) opacity(0.35);
    }
    .modal-box h3 { font-size: 19px; margin-bottom: 6px; }
    .modal-box p { font-size: 13.5px; color: #666; margin-bottom: 20px; }
    
    .btn-primary {
      display: inline-block;
      width: 100%;
      padding: 12px 20px;
      background: var(--morandi-green);
      color: #FFF;
      text-decoration: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    .btn-close {
      margin-top: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 頂部手冊資訊 -->
  <header class="header-card">
    <div class="brand-info">
      <span class="badge">SLOW TRAVEL ATLAS</span>
      <h1>慢漫｜旅行記憶貼紙圖鑑</h1>
      <p>好好生活，慢慢旅行。閱讀方格子遊記，點亮每一處走過的風景與風味。</p>
    </div>
    <div class="progress-box">
      <div class="count" id="progressText">0 / 0</div>
      <div class="label">已點亮記憶貼紙</div>
    </div>
  </header>

  <!-- 國家/主題分類篩選 -->
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" onclick="filterCategory('all', this)">全部足跡</button>
    <button class="filter-btn" onclick="filterCategory('遊記', this)">遊記</button>
    <button class="filter-btn" onclick="filterCategory('台灣', this)">台灣</button>
    <button class="filter-btn" onclick="filterCategory('日本', this)">日本</button>
    <button class="filter-btn" onclick="filterCategory('馬來西亞', this)">馬來西亞</button>
    <button class="filter-btn" onclick="filterCategory('新加坡', this)">新加坡</button>    
  </div>

  <!-- MapSprink 風格圓形陣列 -->
  <main class="sticker-grid" id="stickerGrid"></main>
</div>

<!-- 點擊圓圈後的彈出卡片 -->
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <img id="modalImg" src="" alt="">
    <h3 id="modalTitle"></h3>
    <p id="modalDesc"></p>
    <a id="modalLink" class="btn-primary" href="#" target="_blank">前往方格子閱讀遊記</a>
    <button class="btn-close" onclick="closeModal()">關閉視窗</button>
  </div>
</div>

<script>
  // ==========================================
  // ★ 第一區：你的貼紙圖鑑資料庫 (未來新增貼紙只要改這裡！)
  // ==========================================
  const STICKERS = [
    {
      id: "namheong",                      // 網址參數代號 (?collect=namheong)
      title: "日本東北冬季自由行EP01",                 // 顯示在圓圈下方的名稱
      category: "馬來西亞",                // 分類標籤
      image: "日本東北冬季自由行 EP01｜出國啟程.png",      // 圖片路徑 (放在同資料夾或填圖片網址)
      desc: "啟程踏入銀白國度，從出境整裝到迎著冬日寒風抵達東北的第一站序曲。",
      articleUrl: "https://vocus.cc/article/6ab11965fd8978000116fd53"     // 對應的方格子文章網址
    },
    {
      id: "namheong",                      // 網址參數代號 (?collect=namheong)
      title: "南香茶餐室",                 // 顯示在圓圈下方的名稱
      category: "馬來西亞",                // 分類標籤
      image: "南香茶餐室.png",      // 圖片路徑 (放在同資料夾或填圖片網址)
      desc: "怡保舊街場的早晨香氣，一杯濃醇白咖啡配烤咖央吐司與半熟蛋。",
      articleUrl: "https://vocus.cc/article/6ac6f0e8fd8978000177c75e"     // 對應的方格子文章網址
    },
    {
      id: "taipei101",
      title: "台北101",
      category: "台灣",
      image: "images/台北101.png",
      desc: "穿過信義區的街角微風，仰望城市裡的經典天際線。",
      articleUrl: "https://vocus.cc/"
    },
    {
      id: "fujisan",
      title: "富士山",
      category: "日本",
      image: "images/富士山.png",
      desc: "在晴朗的冬日早晨，遇見覆蓋白雪的靜謐山頭。",
      articleUrl: "https://vocus.cc/"
    },
    {
      id: "lanyang",
      title: "蘭陽博物館",
      category: "台灣",
      image: "images/蘭陽博物館.png",
      desc: "烏石港畔的單面山建築，把東北角的山海光影收進眼底。",
      articleUrl: "https://vocus.cc/"
    },
    {
      id: "zao",
      title: "藏王樹冰",
      category: "日本",
      image: "images/藏王樹冰.png",
      desc: "搭乘纜車穿越銀白雪原，見證大自然雕琢的冬季奇景。",
      articleUrl: "https://vocus.cc/"
    }
  ];

  const STORAGE_KEY = "manman_sticker_collection_v1";
  let currentFilter = "all";

  // 讀取讀者已收集的貼紙紀錄
  function getCollected() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch (e) {
      return {};
    }
  }

  // 儲存貼紙紀錄
  function saveCollected(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  // 渲染貼紙網格
  function renderGrid(justUnlockedId = null) {
    const grid = document.getElementById("stickerGrid");
    const collected = getCollected();
    grid.innerHTML = "";

    const filtered = currentFilter === "all" 
      ? STICKERS 
      : STICKERS.filter(s => s.category === currentFilter);

    filtered.forEach(item => {
      const isUnlocked = Boolean(collected[item.id]);
      const card = document.createElement("div");
      card.className = `sticker-item ${isUnlocked ? "unlocked" : ""} ${justUnlockedId === item.id ? "just-unlocked" : ""}`;
      card.onclick = () => openModal(item, isUnlocked, collected[item.id]);

      // 若圖片尚未上傳，自動顯示優雅的預設插畫圖示避免破圖符號
      const fallbackSvg = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='50' r='36' fill='none' stroke='%23999' stroke-width='2' stroke-dasharray='4 4'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' font-size='13' fill='%23777' font-family='sans-serif'>${encodeURIComponent(item.title)}</text></svg>`;

      card.innerHTML = `
        <div class="circle-slot">
          <img src="${item.image}" alt="${item.title}" onerror="this.onerror=null; this.src='${fallbackSvg}';">
        </div>
        <div class="sticker-title">${item.title}</div>
        <div class="sticker-date">${isUnlocked ? collected[item.id] : "尚未點亮"}</div>
      `;
      grid.appendChild(card);
    });

    // 更新右上角總進度
    const totalUnlocked = STICKERS.filter(s => collected[s.id]).length;
    document.getElementById("progressText").textContent = `${totalUnlocked} / ${STICKERS.length}`;
  }

  // 分類切換
  function filterCategory(category, btnEl) {
    currentFilter = category;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btnEl.classList.add("active");
    renderGrid();
  }

  // 打開貼紙故事彈窗
  function openModal(item, isUnlocked, unlockDate) {
    const modal = document.getElementById("modalBackdrop");
    const img = document.getElementById("modalImg");
    img.src = item.image;
    img.className = isUnlocked ? "" : "locked-img";
    
    document.getElementById("modalTitle").textContent = item.title;
    document.getElementById("modalDesc").textContent = isUnlocked 
      ? `${item.desc}（點亮於 ${unlockDate}）`
      : `這枚貼紙尚未點亮！前往方格子閱讀《${item.title}》遊記，點擊文末連結即可收集這枚貼紙。`;
    
    const linkBtn = document.getElementById("modalLink");
    linkBtn.href = item.articleUrl;
    linkBtn.textContent = isUnlocked ? "重溫這篇方格子遊記" : "前往方格子閱讀並解鎖 →";
    modal.classList.add("show");
  }

  function closeModal() {
    document.getElementById("modalBackdrop").classList.remove("show");
  }

  // 檢查網址是否有 ?collect=xxx 自動點亮貼紙
  function checkUrlUnlock() {
    const params = new URLSearchParams(window.location.search);
    const targetId = params.get("collect") || params.get("stamp");
    if (!targetId) {
      renderGrid();
      return;
    }

    const found = STICKERS.find(s => s.id === targetId);
    if (found) {
      const collected = getCollected();
      const today = new Date().toISOString().slice(0, 10).replace(/-/g, ".");
      collected[found.id] = collected[found.id] || today;
      saveCollected(collected);
      renderGrid(found.id);

      // 清除網址參數讓網址保持乾淨
      window.history.replaceState({}, document.title, window.location.pathname);
    } else {
      renderGrid();
    }
  }

  window.addEventListener("DOMContentLoaded", checkUrlUnlock);
</script>
</body>
</html>
