<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>慢漫｜旅行記憶貼紙圖鑑</title>
  <style>
    :root {
      --bg-page: #F9F8F6;
      --bg-card: #FFFFFF;
      --slot-locked: #EFECE6;    /* 未蓋章：溫潤手賬紙灰圓底 */
      --slot-unlocked: #FAF3E0;  /* 已蓋章：米黃手賬紙底 */
      --accent-yellow: #FFE599;  /* 主題暖黃 */
      --morandi-green: #7A8B7B;  /* 莫蘭迪綠 */
      --stamp-red: #B85D43;      /* 復古印泥磚紅 */
      --text-main: #3D3B38;
      --text-muted: #9A9690;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      padding: 20px 14px 60px;
      line-height: 1.6;
    }

    .container { max-width: 820px; margin: 0 auto; }

    /* 點亮成功頂部通知橫幅 */
    .unlock-toast {
      display: none;
      background: var(--morandi-green);
      color: #FFF;
      padding: 12px 18px;
      border-radius: 16px;
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 6px 20px rgba(122, 139, 123, 0.3);
      animation: slideDown 0.4s ease-out;
    }
    .unlock-toast.show { display: block; }
    @keyframes slideDown {
      from { transform: translateY(-15px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .header-card {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brand-info span.badge {
      display: inline-block;
      background: var(--accent-yellow);
      color: #5C4B1B;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 99px;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .brand-info h1 { font-size: 21px; font-weight: 700; margin-bottom: 4px; }
    .brand-info p { font-size: 13px; color: var(--text-muted); }

    .progress-box {
      background: var(--bg-page);
      padding: 10px 18px;
      border-radius: 16px;
      text-align: center;
      min-width: 120px;
    }
    .progress-box .count { font-size: 22px; font-weight: 800; color: var(--morandi-green); }
    .progress-box .label { font-size: 12px; color: var(--text-muted); }

    /* 第一層：主分頁標籤列 */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-btn {
      background: var(--bg-card);
      border: 1px solid #E5E3DC;
      color: var(--text-main);
      padding: 8px 18px;
      border-radius: 99px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .filter-btn.active {
      background: var(--morandi-green);
      color: #FFF;
      border-color: var(--morandi-green);
      box-shadow: 0 4px 12px rgba(122, 139, 123, 0.25);
    }

    /* 第二層：子分頁標籤列（例如點選「遊記」時自動展開各系列遊記） */
    .sub-filter-bar {
      display: none;
      gap: 8px;
      margin-bottom: 18px;
      padding: 10px 14px;
      background: #F2EFE9;
      border-radius: 16px;
      overflow-x: auto;
      scrollbar-width: none;
      align-items: center;
      animation: fadeIn 0.25s ease;
    }
    .sub-filter-bar.show { display: flex; }
    .sub-filter-bar::-webkit-scrollbar { display: none; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .sub-filter-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
      margin-right: 4px;
    }

    .sub-filter-btn {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid transparent;
      color: var(--text-main);
      padding: 5px 14px;
      border-radius: 99px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .sub-filter-btn.active {
      background: var(--bg-card);
      color: var(--morandi-green);
      border-color: var(--morandi-green);
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    /* 集章網格 */
    .sticker-grid {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 32px 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 32px 16px;
      justify-items: center;
      min-height: 220px;
    }

    .empty-hint {
      grid-column: 1 / -1;
      color: var(--text-muted);
      font-size: 14px;
      padding: 48px 16px;
      text-align: center;
    }

    .sticker-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      width: 130px;
    }

    /* 圓形蓋章槽：裁切超出圓圈的方形白邊 */
    .circle-slot {
      width: 114px;
      height: 114px;
      border-radius: 50%;
      background-color: var(--slot-locked);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      margin-bottom: 10px;
      border: 1.5px dashed #D5D0C5;
    }

    /* 圖片本體：使用 multiply 自動消除圖片白底，產生真實蓋章融合感 */
    .circle-slot img {
      width: 92%;
      height: 92%;
      object-fit: contain;
      mix-blend-mode: multiply;
      filter: grayscale(100%) opacity(0.32);
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      user-select: none;
    }

    /* 已點亮（蓋章後）狀態 */
    .sticker-item.unlocked .circle-slot {
      background-color: var(--slot-unlocked);
      border: 2px dashed rgba(184, 93, 67, 0.45);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.04);
    }

    .sticker-item.unlocked .circle-slot img {
      width: 96%;
      height: 96%;
      filter: grayscale(0%) opacity(0.96) contrast(1.05);
      transform: rotate(-5deg) scale(1.02);
    }

    /* 尚未上傳圖片時的純文字虛線章（防止手機出現藍色問號破圖） */
    .placeholder-stamp {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 1.5px dashed #BDB8AD;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: #9E998E;
      line-height: 1.35;
    }
    .sticker-item.unlocked .placeholder-stamp {
      border: 2px solid var(--stamp-red);
      color: var(--stamp-red);
      transform: rotate(-8deg);
    }

    /* 蓋章瞬間的下壓動畫 */
    @keyframes stampDown {
      0% { transform: scale(2.2) rotate(12deg); opacity: 0; }
      50% { transform: scale(0.9) rotate(-7deg); opacity: 1; }
      75% { transform: scale(1.05) rotate(-4deg); }
      100% { transform: scale(1.02) rotate(-5deg); opacity: 0.96; }
    }
    .sticker-item.just-unlocked .circle-slot img,
    .sticker-item.just-unlocked .placeholder-stamp {
      animation: stampDown 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .sticker-title {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.35;
    }
    .sticker-item.unlocked .sticker-title {
      color: var(--text-main);
      font-weight: 700;
    }

    .sticker-date {
      font-size: 11.5px;
      color: var(--stamp-red);
      font-weight: 600;
      margin-top: 3px;
      font-family: monospace;
    }
    .sticker-item:not(.unlocked) .sticker-date {
      color: var(--text-muted);
      font-weight: 400;
      font-family: inherit;
    }

    /* 彈出詳情視窗 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(40, 38, 35, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-backdrop.show { display: flex; }

    .modal-box {
      background: #FAF8F5;
      border-radius: 24px;
      max-width: 350px;
      width: 100%;
      padding: 26px 22px 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }
    .modal-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .modal-badge.unlocked { background: var(--accent-yellow); color: #5C4B1B; }
    .modal-badge.locked { background: #E5E3DC; color: #777; }

    .modal-stamp-wrap {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: var(--slot-unlocked);
      border: 2px dashed rgba(184, 93, 67, 0.4);
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .modal-stamp-wrap img {
      width: 94%;
      height: 94%;
      object-fit: contain;
      mix-blend-mode: multiply;
      transform: rotate(-5deg);
    }
    .modal-stamp-wrap.locked {
      background: var(--slot-locked);
      border-color: #D5D0C5;
    }
    .modal-stamp-wrap.locked img {
      filter: grayscale(100%) opacity(0.35);
      transform: none;
    }

    .modal-subcat {
      font-size: 12px;
      color: var(--morandi-green);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .modal-box h3 { font-size: 18px; margin-bottom: 8px; }
    .modal-box p { font-size: 13.5px; color: #666; margin-bottom: 18px; }
    
    .btn-primary {
      display: inline-block;
      width: 100%;
      padding: 12px 18px;
      background: var(--morandi-green);
      color: #FFF;
      text-decoration: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
    }
    .btn-close {
      margin-top: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 點亮成功頂部橫幅 -->
  <div class="unlock-toast" id="unlockToast"></div>

  <header class="header-card">
    <div class="brand-info">
      <span class="badge">SLOW TRAVEL ATLAS</span>
      <h1>慢漫｜旅行記憶貼紙圖鑑</h1>
      <p>好好生活，慢慢旅行。閱讀方格子遊記，點亮每一處走過的風景與風味。</p>
    </div>
    <div class="progress-box">
      <div class="count" id="progressText">0 / 0</div>
      <div class="label">已點亮記憶貼紙</div>
    </div>
  </header>

  <!-- 第一層：主分頁 -->
  <div class="filter-bar" id="filterBar"></div>

  <!-- 第二層：子分頁（當該主分頁底下有多個系列時自動浮現！） -->
  <div class="sub-filter-bar" id="subFilterBar"></div>

  <!-- 印章網格 -->
  <main class="sticker-grid" id="stickerGrid"></main>
</div>

<!-- 詳情彈窗 -->
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div id="modalStatusBadge" class="modal-badge"></div>
    <div class="modal-stamp-wrap" id="modalStampWrap"></div>
    <div class="modal-subcat" id="modalSubcat"></div>
    <h3 id="modalTitle"></h3>
    <p id="modalDesc"></p>
    <a id="modalLink" class="btn-primary" href="#" target="_blank">前往方格子閱讀遊記</a>
    <button class="btn-close" onclick="closeModal()">關閉視窗</button>
  </div>
</div>

<script>
  // =========================================================================
  // ★ 1. 第一層主分頁設定（依照你的需求設定為這 6 個）
  // =========================================================================
  const CATEGORIES = ["全部足跡", "遊記", "台灣", "日本", "馬來西亞", "新加坡"];

  // =========================================================================
  // ★ 2. 印章與遊記資料庫
  // 💡 小秘訣：
  // - category: 可寫單一分類（如 "遊記"），或陣列 ["遊記", "日本"] 讓它同時出現在兩個主分頁！
  // - subCategory: 選填！只要填了系列名稱（例如 "日本東北冬季自由行"），
  //   點進「遊記」分頁時，就會自動出現第二層子分頁按鈕！
  // =========================================================================
  const STICKERS = [
    {
      id: "tohoku-winter-ep01",
      title: "日本東北冬季自由行 EP 01",
      category: ["遊記", "日本"],                // 同時出現在「遊記」與「日本」分頁
      subCategory: "日本東北冬季自由行",          // ★ 自動歸類在「遊記」底下的子分頁！
      image: "日本東北冬季自由行EP01｜出國啟程.png",
      desc: "啟程踏入銀白國度，從出境整裝到迎著冬日寒風抵達東北的第一站序曲。",
      articleUrl: "https://vocus.cc/article/6ab0d9effd897800010504cb"
    },
    {
      id: "tohoku-winter-ep02",
      title: "日本東北冬季自由行 EP 02",
      category: ["遊記", "日本"],
      subCategory: "日本東北冬季自由行",
      image: "日本東北冬季自由行EP02｜藏王篇.png",
      desc: "搭乘纜車深入藏王連峰，在漫天風雪中遇見壯闊的冬季樹冰奇景。",
      articleUrl: "https://vocus.cc/article/6ab11965fd8978000116fd53"
    },
    {
      id: "tohoku-winter-ep03",
      title: "日本東北冬季自由行 EP 03",
      category: ["遊記", "日本"],
      subCategory: "日本東北冬季自由行",
      image: "日本東北冬季自由行EP03｜銀山篇.png",
      desc: "走進大雪紛飛的大正浪漫溫泉街，在昏黃瓦斯燈光下收藏銀山溫泉的夢幻夜色。",
      articleUrl: "https://vocus.cc/article/6ab12ee8fd897800011d3cb8"
    },
    {
      id: "tohoku-winter-ep04",
      title: "日本東北冬季自由行 EP 04",
      category: ["遊記", "日本"],
      subCategory: "日本東北冬季自由行",
      image: "日本東北冬季自由行EP04｜狐狸村篇.png",
      desc: "踏著厚厚積雪造訪藏王山林，與換上蓬鬆冬毛的可愛狐狸們來場冬日邂逅。",
      articleUrl: "https://vocus.cc/article/6ab23053fd897800015cfdc3"
    },
    {
      id: "tohoku-winter-ep05",
      title: "日本東北冬季自由行 EP 05",
      category: ["遊記", "日本"],
      subCategory: "日本東北冬季自由行",
      image: "日本東北冬季自由行EP05｜松島篇.png",
      desc: "吹著微涼海風漫步日本三景，在島嶼松影間品嚐剛烤好的鮮甜牡蠣與海味。",
      articleUrl: "https://vocus.cc/article/6ab24580fd8978000161fb0a"
    },
    {
      id: "tohoku-winter-ep06",
      title: "日本東北冬季自由行 EP 06",
      category: ["遊記", "日本"],
      subCategory: "日本東北冬季自由行",
      image: "日本東北冬季自由行EP06｜仙台篇.png",
      desc: "穿梭在熱鬧的仙台街頭與商店街，用炭火香氣十足的厚切牛舌與毛豆奶昔畫下溫暖句點。",
      articleUrl: "https://vocus.cc/article/6ab25351fd89780001907327"
    },
    {
      id: "tohoku-winter-ep07",
      title: "日本東北冬季自由行 EP 07",
      category: ["遊記", "日本"],
      subCategory: "日本東北冬季自由行",
      image: "日本東北冬季自由行EP07｜東京篇.png",
      desc: "搭乘新幹線從北國雪鄉回到繁華都會，在東京街角感受冬日午後的暖陽與城市脈動。",
      articleUrl: "https://vocus.cc/article/6ab264e1fd897800019459d5"
    },
    {
      id: "tohoku-winter-ep08",
      title: "日本東北冬季自由行 EP 08",
      category: ["遊記", "日本"],
      subCategory: "日本東北冬季自由行",
      image: "日本東北冬季自由行EP08｜懷舊篇.png",
      desc: "鑽進充滿歲月溫度的老街與下町巷弄，在復古風景中拾起慢旅獨有的舊日時光。",
      articleUrl: "https://vocus.cc/article/6ab270cdfd8978000196ebd7"
    },
    {
      id: "tohoku-winter-ep09",
      title: "日本東北冬季自由行 EP 09",
      category: ["遊記", "日本"],
      subCategory: "日本東北冬季自由行",
      image: "日本東北冬季自由行EP09｜終章篇.png",
      desc: "將九天八夜的雪國記憶與限定伴手禮收進行囊，帶著滿滿的感動踏上歸途，期待下一場慢旅。",
      articleUrl: "https://vocus.cc/article/6ab37789fd89780001fe3e0b"
    },
    {
      id: "namheong",
      title: "南香茶餐室",
      category: ["馬來西亞", "遊記"],
      subCategory: "馬來西亞怡保慢旅",
      image: "南香茶餐室.png",
      desc: "怡保舊街場的早晨香氣，一杯濃醇白咖啡配烤咖央吐司與半熟蛋。",
      articleUrl: "https://vocus.cc/article/6ab0d9effd897800010504cb"
    }
  ];

  const STORAGE_KEY = "manman_sticker_collection_v1";
  let memoryStore = {};
  let currentFilter = "全部足跡";
  let currentSubFilter = "全部";

  function getCollected() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : memoryStore;
    } catch (e) {
      return memoryStore;
    }
  }

  function saveCollected(data) {
    memoryStore = data;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  // 判斷某張貼紙是否屬於某個主分頁（相容你原本寫的 category 字串、陣列或 tags）
  function belongsToCategory(item, cat) {
    if (cat === "全部足跡") return true;
    if (Array.isArray(item.category) && item.category.includes(cat)) return true;
    if (item.category === cat) return true;
    if (Array.isArray(item.tags) && item.tags.includes(cat)) return true;
    return false;
  }

  // 渲染第一層主分頁
  function renderFilterBar() {
    const bar = document.getElementById("filterBar");
    bar.innerHTML = "";
    CATEGORIES.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = `filter-btn ${cat === currentFilter ? "active" : ""}`;
      btn.textContent = cat;
      btn.onclick = () => {
        currentFilter = cat;
        currentSubFilter = "全部"; // 切換主分頁時重置子分頁
        renderFilterBar();
        renderSubFilterBar();
        renderGrid();
      };
      bar.appendChild(btn);
    });
  }

  // 渲染第二層子分頁（自動偵測該主分頁底下有哪些 subCategory）
  function renderSubFilterBar() {
    const subBar = document.getElementById("subFilterBar");
    subBar.innerHTML = "";

    if (currentFilter === "全部足跡") {
      subBar.classList.remove("show");
      return;
    }

    // 找出目前主分頁底下所有的 subCategory
    const itemsInCat = STICKERS.filter(s => belongsToCategory(s, currentFilter));
    const subCats = [...new Set(itemsInCat.map(s => s.subCategory).filter(Boolean))];

    // 如果這個分頁底下有設定 subCategory，就自動展開第二層子分頁列！
    if (subCats.length > 0) {
      subBar.classList.add("show");
      
      const label = document.createElement("span");
      label.className = "sub-filter-label";
      label.textContent = "📂 系列篩選：";
      subBar.appendChild(label);

      const allSubCats = ["全部", ...subCats];
      allSubCats.forEach(sub => {
        const btn = document.createElement("button");
        btn.className = `sub-filter-btn ${sub === currentSubFilter ? "active" : ""}`;
        btn.textContent = sub === "全部" ? `全部${currentFilter}` : sub;
        btn.onclick = () => {
          currentSubFilter = sub;
          renderSubFilterBar();
          renderGrid();
        };
        subBar.appendChild(btn);
      });
    } else {
      subBar.classList.remove("show");
    }
  }

  // 圖片載入失敗時：先嘗試 images/ 子資料夾，若還沒上傳圖片則顯示純文字虛線章
  function handleImgError(imgEl, rawSrc, title) {
    if (!imgEl.dataset.triedSubfolder && !rawSrc.startsWith("images/")) {
      imgEl.dataset.triedSubfolder = "true";
      imgEl.src = "images/" + rawSrc;
    } else {
      const slot = imgEl.parentElement;
      if (slot) {
        slot.innerHTML = `<div class="placeholder-stamp">${title}</div>`;
      }
    }
  }

  function renderGrid(justUnlockedId = null) {
    const grid = document.getElementById("stickerGrid");
    const collected = getCollected();
    grid.innerHTML = "";

    let filtered = STICKERS.filter(s => belongsToCategory(s, currentFilter));
    if (currentSubFilter !== "全部") {
      filtered = filtered.filter(s => s.subCategory === currentSubFilter);
    }

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-hint">「${currentFilter}」分頁目前還沒有收入印章喔，敬請期待下一段旅程！</div>`;
    } else {
      filtered.forEach(item => {
        const isUnlocked = Boolean(collected[item.id]);
        const card = document.createElement("div");
        card.className = `sticker-item ${isUnlocked ? "unlocked" : ""} ${justUnlockedId === item.id ? "just-unlocked" : ""}`;
        card.onclick = () => openModal(item, isUnlocked, collected[item.id]);

        card.innerHTML = `
          <div class="circle-slot">
            <img src="${item.image}" alt="${item.title}" onerror="handleImgError(this, '${item.image}', '${item.title}')">
          </div>
          <div class="sticker-title">${item.title}</div>
          <div class="sticker-date">${isUnlocked ? collected[item.id] : "尚未點亮"}</div>
        `;
        grid.appendChild(card);
      });
    }

    const totalUnlocked = STICKERS.filter(s => collected[s.id]).length;
    document.getElementById("progressText").textContent = `${totalUnlocked} / ${STICKERS.length}`;
  }

  function openModal(item, isUnlocked, unlockDate, isAutoPop = false) {
    const modal = document.getElementById("modalBackdrop");
    const badge = document.getElementById("modalStatusBadge");
    const wrap = document.getElementById("modalStampWrap");
    const subcatEl = document.getElementById("modalSubcat");

    badge.className = `modal-badge ${isUnlocked ? "unlocked" : "locked"}`;
    badge.textContent = isAutoPop ? "🎉 恭喜蓋下新紀念章！" : (isUnlocked ? `✓ 已蓋章於 ${unlockDate}` : "🔒 尚未點亮");

    wrap.className = `modal-stamp-wrap ${isUnlocked ? "" : "locked"}`;
    wrap.innerHTML = `<img src="${item.image}" alt="${item.title}" onerror="handleImgError(this, '${item.image}', '${item.title}')">`;
    
    subcatEl.textContent = item.subCategory ? `📖 系列：${item.subCategory}` : "";
    document.getElementById("modalTitle").textContent = item.title;

    const cleanDesc = (item.desc && item.desc.trim()) ? item.desc : `紀錄於《${item.title}》的美好旅途記憶。`;
    document.getElementById("modalDesc").textContent = isUnlocked 
      ? cleanDesc
      : `這枚印章尚未點亮！前往方格子閱讀《${item.title}》，點擊文末連結即可蓋章收藏。`;
    
    const linkBtn = document.getElementById("modalLink");
    linkBtn.href = item.articleUrl;
    if (isAutoPop) {
      linkBtn.textContent = "收下印章，查看我的圖鑑 ✨";
      linkBtn.onclick = (e) => { e.preventDefault(); closeModal(); };
    } else {
      linkBtn.textContent = isUnlocked ? "重溫這篇方格子遊記" : "前往方格子閱讀並蓋章 →";
      linkBtn.onclick = null;
    }
    modal.classList.add("show");
  }

  function closeModal() {
    document.getElementById("modalBackdrop").classList.remove("show");
  }

  function checkUrlParams() {
    const rawSearch = window.location.search.replace("？", "?");
    const params = new URLSearchParams(rawSearch);
    const rawTarget = (params.get("collect") || params.get("stamp") || "").trim().toLowerCase();

    if (rawTarget) {
      const found = STICKERS.find(s => 
        s.id.toLowerCase() === rawTarget || 
        s.title.toLowerCase() === rawTarget
      );

      if (found) {
        const collected = getCollected();
        const today = new Date().toISOString().slice(0, 10).replace(/-/g, ".");
        collected[found.id] = collected[found.id] || today;
        saveCollected(collected);

        // 自動幫讀者切換到該印章所屬的分頁，或維持在全部足跡
        renderFilterBar();
        renderSubFilterBar();
        renderGrid(found.id);

        const toast = document.getElementById("unlockToast");
        toast.textContent = `✨ 成功點亮「${found.title}」紀念印章！`;
        toast.classList.add("show");
        openModal(found, true, collected[found.id], true);

        window.history.replaceState({}, document.title, window.location.pathname);
        return;
      }
    }

    renderFilterBar();
    renderSubFilterBar();
    renderGrid();
  }

  window.addEventListener("DOMContentLoaded", checkUrlParams);
</script>
</body>
</html>
