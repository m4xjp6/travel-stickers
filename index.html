<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg-page: #F9F8F6;
      --bg-card: #FFFFFF;
      --accent-yellow: #FFE599;
      --morandi-green: #7A8B7B;
      --text-main: #3D3B38;
      --text-muted: #9A9690;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      padding: 20px 14px 60px;
      line-height: 1.6;
    }

    .container { max-width: 820px; margin: 0 auto; }

    .unlock-toast {
      display: none;
      background: var(--morandi-green);
      color: #FFF;
      padding: 12px 18px;
      border-radius: 16px;
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }
    .unlock-toast.show { display: block; }

    .header-card {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brand-info span.badge {
      display: inline-block;
      background: var(--accent-yellow);
      color: #5C4B1B;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 99px;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .brand-info h1 { font-size: 21px; font-weight: 700; margin-bottom: 4px; }
    .brand-info p { font-size: 13px; color: var(--text-muted); }

    .progress-box {
      background: var(--bg-page);
      padding: 10px 18px;
      border-radius: 16px;
      text-align: center;
      min-width: 120px;
    }
    .progress-box .count { font-size: 22px; font-weight: 800; color: var(--morandi-green); }
    .progress-box .label { font-size: 12px; color: var(--text-muted); }

    /* 主分頁標籤列 */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-btn {
      background: var(--bg-card);
      border: 1px solid #E5E3DC;
      color: var(--text-main);
      padding: 8px 18px;
      border-radius: 99px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .filter-btn.active {
      background: var(--morandi-green);
      color: #FFF;
      border-color: var(--morandi-green);
    }

    /* 子分頁標籤列 */
    .sub-filter-bar {
      display: none;
      gap: 8px;
      margin-bottom: 18px;
      padding: 10px 14px;
      background: #F2EFE9;
      border-radius: 16px;
      overflow-x: auto;
      scrollbar-width: none;
      align-items: center;
    }
    .sub-filter-bar.show { display: flex; }
    .sub-filter-bar::-webkit-scrollbar { display: none; }

    .sub-filter-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
      margin-right: 4px;
    }

    .sub-filter-btn {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid transparent;
      color: var(--text-main);
      padding: 5px 14px;
      border-radius: 99px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .sub-filter-btn.active {
      background: var(--bg-card);
      color: var(--morandi-green);
      border-color: var(--morandi-green);
      font-weight: 700;
    }

    /* 貼紙圖鑑網格 */
    .sticker-grid {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 36px 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 32px 16px;
      justify-items: center;
      min-height: 220px;
    }

    .empty-hint {
      grid-column: 1 / -1;
      color: var(--text-muted);
      font-size: 14px;
      padding: 48px 16px;
      text-align: center;
    }

    .sticker-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      width: 130px;
    }

    /* 圓形底座 */
    .circle-slot {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      background-color: #FFFFFF;
      border: 1.5px dashed #D5D0C5;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease;
      margin-bottom: 10px;
    }

    /* 未點亮：加入 mix-blend-mode: multiply，自動把圖片帶有的白底變成全透明！ */
    .circle-slot img {
      width: 86%;
      height: 86%;
      object-fit: contain;
      filter: grayscale(100%) opacity(0.4);
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      user-select: none;
    }

    /* 已點亮：虛線框隱藏，呈現 100% 全彩貼紙 */
    .sticker-item.unlocked .circle-slot {
      background-color: #FFFFFF;
      border: 1.5px dashed transparent;
      overflow: visible;
    }

    .sticker-item.unlocked .circle-slot img {
      width: 104%;
      height: 104%;
      mix-blend-mode: multiply;
      filter: grayscale(0%) opacity(1);
      transform: scale(1.04);
    }

    .sticker-item:hover .circle-slot {
      transform: translateY(-3px);
    }

    .placeholder-stamp {
      font-size: 12px;
      font-weight: 500;
      color: #888;
      text-align: center;
      padding: 10px;
      line-height: 1.35;
    }

    @keyframes popIn {
      0% { transform: scale(1.5); opacity: 0; }
      70% { transform: scale(0.95); opacity: 1; }
      100% { transform: scale(1.04); opacity: 1; }
    }
    .sticker-item.just-unlocked .circle-slot img {
      animation: popIn 0.5s ease-out forwards;
    }

    .sticker-title {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.35;
    }
    .sticker-item.unlocked .sticker-title {
      color: var(--text-main);
      font-weight: 700;
    }

    .sticker-date {
      font-size: 11.5px;
      color: var(--morandi-green);
      font-weight: 600;
      margin-top: 3px;
    }
    .sticker-item:not(.unlocked) .sticker-date {
      color: var(--text-muted);
      font-weight: 400;
    }

    /* 彈出詳情視窗 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(40, 38, 35, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-backdrop.show { display: flex; }

    .modal-box {
      background: #FFFFFF;
      border-radius: 24px;
      max-width: 350px;
      width: 100%;
      padding: 28px 22px 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.18);
    }
    .modal-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .modal-badge.unlocked { background: var(--accent-yellow); color: #5C4B1B; }
    .modal-badge.locked { background: #E5E2DA; color: #777; }

    .modal-stamp-wrap {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 1.5px dashed #D5D0C5;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .modal-stamp-wrap img {
      width: 96%;
      height: 96%;
      object-fit: contain;
      mix-blend-mode: multiply;
    }
    .modal-stamp-wrap.locked img {
      width: 86%;
      height: 86%;
      mix-blend-mode: multiply;
      filter: grayscale(100%) opacity(0.4);
    }

    .modal-subcat {
      font-size: 12px;
      color: var(--morandi-green);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .modal-box h3 { font-size: 18px; margin-bottom: 8px; }
    .modal-box p { font-size: 13.5px; color: #666; margin-bottom: 18px; }
    
    .btn-primary {
      display: inline-block;
      width: 100%;

      background: var(--morandi-green);
      color: #FFF;
      text-decoration: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
    }
    .btn-close {
      margin-top: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>

      subCategory: "台灣宜蘭秋季自由行",
      image: "台灣宜蘭秋季自由行 EP04｜蔚藍篇.png",
      desc: "迎著秋日晴空下的無垠蔚藍海景，將龜山島與太平洋的浪漫記憶收進心底。",
      articleUrl: "https://vocus.cc/article/6ab4e7ebfd8978000166b663"
    }
  ];

  const STORAGE_KEY = "manman_sticker_collection_v1";
  let memoryStore = {};
  let currentFilter = "全部足跡";
  let currentSubFilter = "全部";

  function getCollected() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : memoryStore;
    } catch (e) {
      return memoryStore;
    }
  }

  function saveCollected(data) {
    memoryStore = data;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function belongsToCategory(item, cat) {
    if (cat === "全部足跡") return true;
    if (Array.isArray(item.category) && item.category.includes(cat)) return true;
    if (item.category === cat) return true;
    return false;
  }

  function renderFilterBar() {
    const bar = document.getElementById("filterBar");
    bar.innerHTML = "";
    CATEGORIES.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = `filter-btn ${cat === currentFilter ? "active" : ""}`;
      btn.textContent = cat;
      btn.onclick = () => {
        currentFilter = cat;
        currentSubFilter = "全部";
        renderFilterBar();
        renderSubFilterBar();
        renderGrid();
      };
      bar.appendChild(btn);
    });
  }

  function renderSubFilterBar() {
    const subBar = document.getElementById("subFilterBar");
    subBar.innerHTML = "";

    if (currentFilter === "全部足跡") {
      subBar.classList.remove("show");
      return;
    }

    const itemsInCat = STICKERS.filter(s => belongsToCategory(s, currentFilter));
    const subCats = [...new Set(itemsInCat.map(s => s.subCategory).filter(Boolean))];

    if (subCats.length > 0) {
      subBar.classList.add("show");
      const label = document.createElement("span");
      label.className = "sub-filter-label";
      label.textContent = "📂 系列篩選：";
      subBar.appendChild(label);

      const allSubCats = ["全部", ...subCats];
      allSubCats.forEach(sub => {
        const btn = document.createElement("button");
        btn.className = `sub-filter-btn ${sub === currentSubFilter ? "active" : ""}`;
        btn.textContent = sub === "全部" ? `全部${currentFilter}` : sub;
        btn.onclick = () => {
          currentSubFilter = sub;
          renderSubFilterBar();
          renderGrid();
        };
        subBar.appendChild(btn);
      });
    } else {
      subBar.classList.remove("show");
    }
  }

  function handleImgError(imgEl, rawSrc, title) {
    if (!imgEl.dataset.triedSubfolder && !rawSrc.startsWith("images/")) {
      imgEl.dataset.triedSubfolder = "true";
      imgEl.src = "images/" + rawSrc;
    } else {
      const slot = imgEl.parentElement;
      if (slot) {
        slot.innerHTML = `<div class="placeholder-stamp">${title}</div>`;
      }
    }
  }

  function renderGrid(justUnlockedId = null) {
    const grid = document.getElementById("stickerGrid");
    const collected = getCollected();
    grid.innerHTML = "";

    let filtered = STICKERS.filter(s => belongsToCategory(s, currentFilter));
    if (currentSubFilter !== "全部") {
      filtered = filtered.filter(s => s.subCategory === currentSubFilter);
    }

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-hint">「${currentFilter}」分頁目前還沒有貼紙喔，敬請期待下一段旅程！</div>`;
    } else {
      filtered.forEach(item => {
        const isUnlocked = Boolean(collected[item.id]);
        const card = document.createElement("div");
        card.className = `sticker-item ${isUnlocked ? "unlocked" : ""} ${justUnlockedId === item.id ? "just-unlocked" : ""}`;
        card.onclick = () => openModal(item, isUnlocked, collected[item.id]);

        card.innerHTML = `
          <div class="circle-slot">
            <img src="${encodeURI(item.image)}" alt="${item.title}" onerror="handleImgError(this, '${item.image}', '${item.title}')">
          </div>
          <div class="sticker-title">${item.title}</div>
          <div class="sticker-date">${isUnlocked ? collected[item.id] : "尚未點亮"}</div>
        `;
        grid.appendChild(card);
      });
    }

    const totalUnlocked = STICKERS.filter(s => collected[s.id]).length;
    document.getElementById("progressText").textContent = `${totalUnlocked} / ${STICKERS.length}`;
  }

  function openModal(item, isUnlocked, unlockDate, isAutoPop = false) {
    const modal = document.getElementById("modalBackdrop");
    const badge = document.getElementById("modalStatusBadge");
    const wrap = document.getElementById("modalStampWrap");
    const subcatEl = document.getElementById("modalSubcat");

    badge.className = `modal-badge ${isUnlocked ? "unlocked" : "locked"}`;
    badge.textContent = isAutoPop ? "🎉 恭喜點亮新記憶貼紙！" : (isUnlocked ? `✓ 已點亮於 ${unlockDate}` : "🔒 尚未點亮");

    wrap.className = `modal-stamp-wrap ${isUnlocked ? "" : "locked"}`;
    wrap.innerHTML = `<img src="${encodeURI(item.image)}" alt="${item.title}" onerror="handleImgError(this, '${item.image}', '${item.title}')">`;
    
    subcatEl.textContent = item.subCategory ? `📖 系列：${item.subCategory}` : "";
    document.getElementById("modalTitle").textContent = item.title;

    const cleanDesc = (item.desc && item.desc.trim()) ? item.desc : `紀錄於《${item.title}》的美好旅途記憶。`;
    document.getElementById("modalDesc").textContent = isUnlocked 
      ? cleanDesc
      : `這枚貼紙尚未點亮！前往方格子閱讀《${item.title}》，點擊文末連結即可點亮收藏。`;
    
    const linkBtn = document.getElementById("modalLink");
    linkBtn.href = item.articleUrl;
    if (isAutoPop) {
      linkBtn.textContent = "收下貼紙，查看我的圖鑑 ✨";
      linkBtn.onclick = (e) => { e.preventDefault(); closeModal(); };
    } else {
      linkBtn.textContent = isUnlocked ? "重溫這篇方格子遊記" : "前往方格子閱讀並點亮 →";
      linkBtn.onclick = null;
    }
    modal.classList.add("show");
  }

  function closeModal() {
    document.getElementById("modalBackdrop").classList.remove("show");
  }

  function checkUrlParams() {
    const rawSearch = window.location.search.replace("？", "?");
    const params = new URLSearchParams(rawSearch);
    const rawTarget = (params.get("collect") || params.get("stamp") || "").trim().toLowerCase();

    if (rawTarget) {
      const found = STICKERS.find(s => 
        s.id.toLowerCase() === rawTarget || 
        s.title.toLowerCase() === rawTarget
      );

      if (found) {
        const collected = getCollected();
        const today = new Date().toISOString().slice(0, 10).replace(/-/g, ".");
        collected[found.id] = collected[found.id] || today;
        saveCollected(collected);

        renderFilterBar();
        renderSubFilterBar();
        renderGrid(found.id);

        const toast = document.getElementById("unlockToast");
        toast.textContent = `✨ 成功點亮「${found.title}」記憶貼紙！`;
        toast.classList.add("show");
        openModal(found, true, collected[found.id], true);

        window.history.replaceState({}, document.title, window.location.pathname);
        return;
      }
    }

    renderFilterBar();
    renderSubFilterBar();
    renderGrid();
  }

  window.addEventListener("DOMContentLoaded", checkUrlParams);
</script>
